<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<meta name="description" content="{% block description %}Look up any English word and see its British and American pronunciations in the International Phonetic Alphabet, with definitions and example sentences.{% endblock %}">
<meta name="color-scheme" content="light dark">
{% block canonical %}<link rel="canonical" href="{{ site_url }}{{ request.path }}">{% endblock %}
<link rel="stylesheet" href="{{ asset('css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>ə</text></svg>">
{% block head %}{% endblock %}
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ url_for('pages.home') }}">
      <span class="brand-mark" aria-hidden="true">ə</span>
      <span class="brand-text">{{ site_name }}</span>
    </a>
    <p class="tagline">British &amp; American pronunciations, written out</p>
  </div>
</header>

<div class="wrap">
  <form class="search" id="search-form" role="search" autocomplete="off" action="{{ url_for('pages.search') }}" method="get">
    <div class="search-field">
      <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input
        id="q"
        type="search"
        name="q"
        value="{{ query or '' }}"
        placeholder="Search a word — try “schedule”"
        aria-label="Search for a word"
        role="combobox"
        aria-expanded="false"
        aria-controls="suggestions"
        aria-autocomplete="list"
        spellcheck="false">
      <button type="button" id="clear" class="clear" aria-label="Clear search" {% if not query %}hidden{% endif %}>&times;</button>
    </div>
    <ul id="suggestions" class="suggestions" role="listbox" aria-label="Suggestions" hidden></ul>
  </form>
</div>

<main id="main" class="wrap">
{% block main %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>
      <a href="{{ url_for('pages.browse', letter='a') }}">Browse A–Z</a> ·
      <a href="{{ url_for('pages.about') }}">About the data</a>
    </p>
  </div>
</footer>

<script src="{{ asset('js/app.js') }}" type="module"></script>
</body>
</html>
